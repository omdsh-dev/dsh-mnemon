name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install release tooling
        run: npm install --global npm@11 pnpm@10.13.1

      - name: Verify complete release and channel
        run: pnpm run release:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run verify

      - name: Verify independent plugin artifacts and one-package installation
        run: pnpm run verify:plugins

      - name: Pack all artifacts and publish plugins before the Starter
        run: node scripts/release.mjs --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
