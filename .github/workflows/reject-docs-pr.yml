name: Reject documentation-only PRs

on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reject:
    name: Close external documentation-only PRs
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Auto-close external documentation-only PRs
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = (pr.title || '').trim();
            if (!/^docs(?:\b|\s*\()/i.test(title)) {
              return;
            }

            let isMaintainer = false;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: pr.user.login,
              });
              isMaintainer = ['admin', 'maintain', 'write'].includes(data.permission);
            } catch (error) {
              core.info(`Contributor permission lookup returned no write grant: ${error.message}`);
            }
            if (isMaintainer) {
              core.info(`PR #${pr.number} is a maintainer documentation change; keeping it open.`);
              return;
            }

            const comment = [
              '本仓库不直接接受外部贡献者的仅文档类 PR，此 PR 已被自动关闭。',
              '',
              `请先到 https://github.com/${context.repo.owner}/${context.repo.repo}/issues 使用 Issue Form 说明需要修正的内容。`,
              '若本 PR 实际包含代码修复，请使用对应的 Conventional Commits 标题并按完整 PR 模板重新提交。',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: comment,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              state: 'closed',
              state_reason: 'not_planned',
            });
            core.setFailed(`PR #${pr.number} is an external documentation-only contribution.`);
