# Bundle layer: DSH loads this file automatically when dsh-mnemon is enabled.
# Do NOT copy its insert block into the profile's cordis.patch.yml: doing so
# duplicates entry IDs and prevents Settings from saving (issue #470).
# Keep profile overrides as top-level - id: mnemon rows. See the installation
# guide's "Settings cannot save after manual installation" recovery steps.
- insert:
    # Keep the v0.4 `mnemon` Entry as the public configuration target while
    # making every v0.5 component inherit its enabled state. The expression
    # reads the core row's own flag (rather than its effective state) to avoid
    # recursing through this ancestor gate. The group itself prepares the
    # Starter's dependency resolution before it imports its children.
    - id: mnemon-bundle
      name: dsh-mnemon/bundle
      group: true
      disabled: !!js >-
        (() => {
          let bundle = ctx[Symbol.for('cordis.entry')];
          while (bundle && !/(?:^|-)mnemon-bundle$/.test(bundle.options.id)) {
            bundle = bundle.parent?.ctx.fiber.entry;
          }
          if (!bundle?.subgroup) return false;
          const coreId = bundle.options.id.replace(/-bundle$/, '');
          const core = [...loader.entries()].find(entry =>
            entry.parent === bundle.subgroup && entry.options.id === coreId);
          const disabled = core?.options.disabled;
          return disabled?.__jsExpr
            ? Boolean(core.evaluate(disabled.__jsExpr))
            : Boolean(disabled);
        })()
      config:
        - id: mnemon
          # Core/Host and default settings. Sources own their independent Entries.
          name: dsh-mnemon
          config:
            routingGuidance: true
            lifecycleEnabled: true
            recallMode: guided
            writebackMode: guided
            idleReviewMs: 30000
            tabEnabled: true
            writeEnabled: true
            remoteAccess: read-only
            timeoutMs: 10000
            defaultRecallLimit: 10
            embedding:
              enabled: false
              endpoint: http://localhost:11434
              model: nomic-embed-text
            recallQuality:
              policy: strict-v1
              lowScoreThreshold: 0.25
              highScoreThreshold: 0.6
              candidateMultiplier: 3
              maxMediumResults: 4
              maxRankedResults: 4
              maxUnknownResults: 2
        - id: mnemon-source-runtime
          name: dsh-mnemon-source-runtime
        - id: mnemon-source-documents
          name: dsh-mnemon-source-documents
        - id: mnemon-source-memory-spaces
          name: dsh-mnemon-source-memory-spaces
          config:
            # Every default Provider is an
            # explicit child. A custom parent composition may choose a subset.
            providers:
              - use: dsh-mnemon-provider-mnemon-native
                instanceId: mnemon-native
              - use: dsh-mnemon-provider-openviking
                instanceId: openviking
              - use: dsh-mnemon-provider-honcho
                instanceId: honcho
              - use: dsh-mnemon-provider-mem0
                instanceId: mem0
              - use: dsh-mnemon-provider-hindsight
                instanceId: hindsight
              - use: dsh-mnemon-provider-holographic
                instanceId: holographic
              - use: dsh-mnemon-provider-retaindb
                instanceId: retaindb
              - use: dsh-mnemon-provider-byterover
                instanceId: byterover
              - use: dsh-mnemon-provider-supermemory
                instanceId: supermemory
        # Skills keep DSH's own files and their evolution data; the page lives
        # in the Memory System and nothing joins a model View.
        - id: mnemon-source-skills
          name: dsh-mnemon-source-skills
        - id: mnemon-strategy-default-three-tier
          name: dsh-mnemon-strategy-default-three-tier
        # A second main Strategy; memoryView.strategyTypeId selects which one
        # composes the View. It stays off until selected.
        - id: mnemon-strategy-general
          name: dsh-mnemon-strategy-general
          disabled: true
        # v0.5 ships these narrowly scoped enhancements with the Starter so the
        # Settings switches are always available. They remain opt-in.
        - id: mnemon-strategy-auto-capture
          name: dsh-mnemon-strategy-auto-capture
          disabled: true
        - id: mnemon-strategy-light-context
          name: dsh-mnemon-strategy-light-context
          disabled: true
        - id: mnemon-strategy-scoped
          name: dsh-mnemon-strategy-scoped
          disabled: true
