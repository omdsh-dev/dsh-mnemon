# Mount the Mnemon bridge into a DSH profile. A profile's final patch may
# replace this config row as a whole; use user settings or environment
# variables for one-field overrides such as cliPath.
# Connection's generic RPC registry uses its owning Context to mount routes.
# DSH 0.1.5's Web profile omits this dependency from that service's scope.
- id: connection
  inject: [webRuntime, webServer]

- insert:
    # Keep the v0.4 `mnemon` Entry as the public configuration target while
    # making every v0.5 component inherit its enabled state. The expression
    # reads the core row's own flag (rather than its effective state) to avoid
    # recursing through this ancestor gate.
    - id: mnemon-bundle
      name: cordis:group
      group: true
      disabled: !!js >-
        ((entry) => entry.options.disabled?.__jsExpr
          ? Boolean(entry.evaluate(entry.options.disabled.__jsExpr))
          : Boolean(entry.options.disabled))
        ([...loader.entries()].find(entry => entry.options.id === 'mnemon'))
      config:
        - id: mnemon
          # Core/Host and default settings. Sources own their independent Entries.
          name: dsh-mnemon
          config:
            routingGuidance: true
            lifecycleEnabled: true
            recallMode: guided
            writebackMode: guided
            idleReviewMs: 30000
            tabEnabled: true
            writeEnabled: true
            remoteAccess: read-only
            timeoutMs: 10000
            defaultRecallLimit: 10
            embedding:
              enabled: false
              endpoint: http://localhost:11434
              model: nomic-embed-text
            recallQuality:
              policy: strict-v1
              lowScoreThreshold: 0.25
              highScoreThreshold: 0.6
              candidateMultiplier: 3
              maxMediumResults: 4
              maxUnknownResults: 2
        - id: mnemon-source-runtime
          name: dsh-mnemon-source-runtime
        - id: mnemon-source-documents
          name: dsh-mnemon-source-documents
        - id: mnemon-source-memory-spaces
          name: dsh-mnemon-source-memory-spaces
          config:
            # Every default Provider is an
            # explicit child. A custom parent composition may choose a subset.
            providers:
              - use: dsh-mnemon-provider-mnemon-native
                instanceId: mnemon-native
              - use: dsh-mnemon-provider-openviking
                instanceId: openviking
              - use: dsh-mnemon-provider-honcho
                instanceId: honcho
              - use: dsh-mnemon-provider-mem0
                instanceId: mem0
              - use: dsh-mnemon-provider-hindsight
                instanceId: hindsight
              - use: dsh-mnemon-provider-holographic
                instanceId: holographic
              - use: dsh-mnemon-provider-retaindb
                instanceId: retaindb
              - use: dsh-mnemon-provider-byterover
                instanceId: byterover
              - use: dsh-mnemon-provider-supermemory
                instanceId: supermemory
        - id: mnemon-strategy-default-three-tier
          name: dsh-mnemon-strategy-default-three-tier
        # v0.5 ships these narrowly scoped enhancements with the Starter so the
        # Settings switches are always available. They remain opt-in.
        - id: mnemon-strategy-auto-capture
          name: dsh-mnemon-strategy-auto-capture
          disabled: true
        - id: mnemon-strategy-light-context
          name: dsh-mnemon-strategy-light-context
          disabled: true
        - id: mnemon-strategy-scoped
          name: dsh-mnemon-strategy-scoped
          disabled: true
        # Optional workspace Sources and their explicit complete Strategy.
        - id: mnemon-source-project-context
          name: dsh-mnemon-source-project-context
          disabled: true
        - id: mnemon-source-journal
          name: dsh-mnemon-source-journal
          disabled: true
        - id: mnemon-source-tasks
          name: dsh-mnemon-source-tasks
          disabled: true
        - id: mnemon-source-playbooks
          name: dsh-mnemon-source-playbooks
          disabled: true
        - id: mnemon-source-files
          name: dsh-mnemon-source-files
          disabled: true
        - id: mnemon-source-sessions
          name: dsh-mnemon-source-sessions
          disabled: true
        - id: mnemon-strategy-workspace
          name: dsh-mnemon-strategy-workspace
          disabled: true
        - id: mnemon-strategy-journal-capture
          name: dsh-mnemon-strategy-journal-capture
          disabled: true
        - id: mnemon-strategy-review-cycle
          name: dsh-mnemon-strategy-review-cycle
          disabled: true
        - id: mnemon-strategy-prompt-schedule
          name: dsh-mnemon-strategy-prompt-schedule
          disabled: true
        - id: mnemon-strategy-team-coordination
          name: dsh-mnemon-strategy-team-coordination
          disabled: true
        - id: mnemon-source-agent-jobs
          name: dsh-mnemon-source-agent-jobs
          disabled: true
        - id: mnemon-source-review
          name: dsh-mnemon-source-review
          disabled: true
        - id: mnemon-source-collaboration
          name: dsh-mnemon-source-collaboration
          disabled: true
        - id: mnemon-source-notifications
          name: dsh-mnemon-source-notifications
          disabled: true
        - id: mnemon-strategy-focus
          name: dsh-mnemon-strategy-focus
          disabled: true
        - id: mnemon-source-canvas
          name: dsh-mnemon-source-canvas
          disabled: true

        - id: mnemon-source-sync
          name: dsh-mnemon-source-sync
          disabled: true
        - id: mnemon-source-learning
          name: dsh-mnemon-source-learning
          disabled: true
        - id: mnemon-strategy-skill-refinement
          name: dsh-mnemon-strategy-skill-refinement
          disabled: true
        - id: mnemon-strategy-learning-cycle
          name: dsh-mnemon-strategy-learning-cycle
          disabled: true
